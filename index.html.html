<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시설팀 객실 스케줄</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222535;
    --border: #2e3347;
    --accent: #4f8ef7;
    --accent2: #7c5cfa;
    --green: #34d399;
    --yellow: #fbbf24;
    --text: #e8eaf0;
    --text2: #8b91a8;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 16px 80px;
  }

  header {
    text-align: center;
    padding: 28px 0 24px;
  }

  header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  header p {
    font-size: 13px;
    color: var(--text2);
    margin-top: 6px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    background: var(--surface);
    border-radius: var(--radius);
    padding: 6px;
  }

  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--text2);
    transition: all 0.2s;
  }

  .tab.active {
    background: var(--accent);
    color: white;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
  }

  .card label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 10px;
  }

  select, input[type="date"] {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
    font-family: 'Noto Sans KR', sans-serif;
    padding: 12px 14px;
    outline: none;
    appearance: none;
    -webkit-appearance: none;
  }

  select:focus, input[type="date"]:focus {
    border-color: var(--accent);
  }

  .btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: white;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    margin-top: 4px;
    letter-spacing: -0.3px;
  }

  .btn:active { opacity: 0.85; transform: scale(0.99); }

  .result-area {
    margin-top: 16px;
  }

  .result-header {
    font-size: 12px;
    color: var(--text2);
    margin-bottom: 10px;
    font-weight: 500;
  }

  .result-empty {
    text-align: center;
    padding: 32px 16px;
    color: var(--text2);
    font-size: 14px;
  }

  /* 날짜별 결과 - 지점별 그룹 */
  .branch-group {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 10px;
    overflow: hidden;
  }

  .branch-header {
    padding: 12px 14px;
    background: var(--surface2);
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .branch-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }

  .room-chips {
    padding: 12px 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 13px;
    font-weight: 500;
    color: var(--green);
  }

  /* 호실별 결과 - 날짜 목록 */
  .date-list {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .date-item {
    display: flex;
    align-items: center;
    padding: 11px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    gap: 10px;
  }

  .date-item:last-child { border-bottom: none; }

  .date-day {
    font-weight: 700;
    min-width: 90px;
  }

  .date-dow {
    font-size: 12px;
    color: var(--text2);
  }

  .date-dow.sat { color: #60a5fa; }
  .date-dow.sun { color: #f87171; }

  .dot-green {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--green);
    flex-shrink: 0;
  }

  .month-divider {
    padding: 8px 14px 4px;
    font-size: 11px;
    color: var(--text2);
    font-weight: 600;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
  }

  .count-badge {
    background: var(--accent);
    color: white;
    border-radius: 12px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 700;
    margin-left: auto;
  }

  .today-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--accent);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 600;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    margin-left: 8px;
  }

  .summary-line {
    background: linear-gradient(135deg, rgba(79,142,247,0.15), rgba(124,92,250,0.15));
    border: 1px solid rgba(79,142,247,0.3);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 14px;
    font-size: 14px;
    font-weight: 500;
  }

  .summary-line span {
    color: var(--accent);
    font-weight: 700;
  }

  .branch-colors {
    --c0: #4f8ef7;
    --c1: #7c5cfa;
    --c2: #34d399;
    --c3: #fbbf24;
    --c4: #f472b6;
    --c5: #fb923c;
    --c6: #a78bfa;
    --c7: #38bdf8;
    --c8: #4ade80;
  }

  .upload-fab{position:fixed;bottom:24px;right:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border:none;border-radius:50px;padding:12px 20px;font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;box-shadow:0 4px 20px rgba(79,142,247,0.4);z-index:100;display:flex;align-items:center;gap:6px;}
  .upload-panel{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding:20px 20px 36px;z-index:200;box-shadow:0 -8px 40px rgba(0,0,0,0.4);}
  .upload-panel h3{font-size:15px;font-weight:700;margin-bottom:6px;}
  .upload-panel p{font-size:12px;color:var(--text2);margin-bottom:16px;line-height:1.6;}
  .upload-drop{border:2px dashed var(--border);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;transition:all 0.2s;margin-bottom:12px;}
  .upload-drop:hover,.upload-drop.drag-over{border-color:var(--accent);background:rgba(79,142,247,0.08);}
  .upload-drop-icon{font-size:28px;margin-bottom:8px;}
  .upload-drop-text{font-size:13px;color:var(--text2);}
  .upload-drop-text span{color:var(--accent);font-weight:600;}
  .upload-panel-close{position:absolute;top:16px;right:20px;background:var(--surface2);border:none;color:var(--text2);border-radius:50%;width:30px;height:30px;font-size:16px;cursor:pointer;}
  #fileInput{display:none;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:150;}
  .toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;width:90%;max-width:340px;}
  .toast{padding:12px 16px;border-radius:10px;font-size:13px;font-weight:500;animation:slideDown 0.3s ease;}
  .toast-success{background:#065f46;color:#6ee7b7;border:1px solid #034f3a;}
  .toast-warn{background:#78350f;color:#fcd34d;border:1px solid #5c2a0a;}
  .toast-error{background:#7f1d1d;color:#fca5a5;border:1px solid #5c1414;}
  .toast-info{background:#1e3a5f;color:#93c5fd;border:1px solid #1d4ed8;}
  @keyframes slideDown{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}
  .gas-setup-panel{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);border-radius:20px 20px 0 0;padding:20px 20px 36px;z-index:300;box-shadow:0 -8px 40px rgba(0,0,0,0.5);}
  .gas-setup-panel h3{font-size:15px;font-weight:700;margin-bottom:8px;}
  .gas-setup-panel p{font-size:12px;color:var(--text2);margin-bottom:14px;line-height:1.7;}
  .gas-url-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13px;font-family:'Noto Sans KR',sans-serif;padding:11px 14px;outline:none;margin-bottom:10px;}
  .gas-url-input:focus{border-color:var(--accent);}
  .btn-small{padding:10px 16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:white;border:none;border-radius:8px;font-size:13px;font-weight:700;font-family:'Noto Sans KR',sans-serif;cursor:pointer;width:100%;}
  .drive-status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);margin-top:10px;padding:8px 12px;background:var(--surface2);border-radius:8px;}
  .drive-dot{width:8px;height:8px;border-radius:50%;background:var(--text2);flex-shrink:0;}
  .drive-dot.connected{background:var(--green);}
  .drive-link-btn{width:100%;padding:11px;background:var(--surface2);border:1px solid var(--border);color:var(--accent);border-radius:8px;font-size:13px;font-weight:600;font-family:'Noto Sans KR',sans-serif;cursor:pointer;margin-top:6px;}
  .work-section{margin-bottom:14px;}
  .work-section-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:10px 14px;border-radius:var(--radius) var(--radius) 0 0;border:1px solid var(--border);}
  .work-section-title.blue{background:rgba(66,133,244,0.15);border-color:rgba(66,133,244,0.3);color:#93c5fd;}
  .work-section-title.red{background:rgba(255,0,0,0.12);border-color:rgba(255,0,0,0.3);color:#fca5a5;}
  .work-section-title.yellow{background:rgba(255,193,7,0.12);border-color:rgba(255,193,7,0.3);color:#fcd34d;}
  .work-list{border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius);overflow:hidden;}
  .work-item{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;}
  .work-item:last-child{border-bottom:none;}
  .work-item-header{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .work-room{font-weight:700;font-size:14px;}
  .work-branch{font-size:11px;color:var(--text2);background:var(--surface2);padding:2px 7px;border-radius:10px;}
  .work-assignee{font-size:12px;color:var(--text2);margin-left:auto;}
  .work-task{font-size:12px;margin-top:4px;}
  .task-done{color:var(--green);}
  .task-fail{color:#f87171;}
  .task-unknown{color:var(--yellow);}
  .memo-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--text2);line-height:1.7;}
  .memo-box-title{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:6px;letter-spacing:0.5px;}

</style>
</head>
<body>

<header>
  <h1>🏨 시설팀 객실 스케줄</h1>
  <p>체크아웃 객실 조회 · 보수 작업 스케줄러</p>
</header>

<div class="tabs">
  <div class="tab active" onclick="switchTab(0)">📅 날짜별 조회</div>
  <div class="tab" onclick="switchTab(1)">🚪 호실별 조회</div>
  <div class="tab" onclick="switchTab(2)">🔧 업무현황</div>
</div>

<!-- 패널 1: 날짜 입력 → 체크아웃 호실 -->
<div class="panel active" id="panel0">
  <div class="card">
    <label>조회 날짜</label>
    <div style="display:flex;gap:8px;align-items:center;">
      <input type="date" id="dateInput" style="flex:1;">
      <button class="today-btn" onclick="setToday()">오늘</button>
    </div>
  </div>
  <button class="btn" onclick="queryByDate()">체크아웃 객실 조회</button>
  <div class="result-area" id="dateResult"></div>
</div>

<!-- 패널 2: 호실 선택 → 체크아웃 날짜 -->
<div class="panel" id="panel1">
  <div class="card">
    <label>지점 선택</label>
    <select id="branchSelect" onchange="updateRoomSelect()">
      <option value="">-- 지점을 선택하세요 --</option>
    </select>
  </div>
  <div class="card">
    <label>호실 선택</label>
    <select id="roomSelect">
      <option value="">-- 지점을 먼저 선택하세요 --</option>
    </select>
  </div>
  <button class="btn" onclick="queryByRoom()">체크아웃 날짜 조회</button>
  <div class="result-area" id="roomResult"></div>
</div>

<div class="panel" id="panel2">
  <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
    <span id="workDateLabel" style="font-weight:600;font-size:1rem;"></span>
    <button class="today-btn" onclick="queryWorkStatus()">🔄 새로고침</button>
  </div>
  <div class="result-area" id="workResult"></div>
</div>


<div class="overlay" id="overlay" onclick="closeAll()"></div>
<div class="toast-container" id="toastContainer"></div>
<button class="upload-fab" onclick="openUpload()">📂 스케줄 업데이트</button>
<div class="upload-panel" id="updatePanel">
  <button class="upload-panel-close" onclick="closeAll()">&#x2715;</button>
  <h3>📂 엑셀 파일 업데이트</h3>
  <p>새 스케줄 파일을 올리면 바로 반영됩니다.</p>
  <div class="upload-drop" onclick="document.getElementById('fileInput').click()"
    ondragover="event.preventDefault();this.classList.add('drag-over')"
    ondragleave="this.classList.remove('drag-over')"
    ondrop="event.preventDefault();this.classList.remove('drag-over');handleFiles(event.dataTransfer.files)">
    <div class="upload-drop-icon">📎</div>
    <div class="upload-drop-text">여기를 탭하거나 파일을 드래그하세요<br><span>xlsx 파일만 가능</span></div>
  </div>
  <input type="file" id="fileInput" accept=".xlsx" multiple onchange="handleFiles(this.files)">
  <button class="drive-link-btn" onclick="closeAll();openGasSetup()">☁️ 구글 드라이브 연동 설정</button>
</div>
<div class="gas-setup-panel" id="gasSetupPanel">
  <button class="upload-panel-close" onclick="closeAll()">&#x2715;</button>
  <h3>☁️ 구글 드라이브 연동</h3>
  <p>Apps Script URL을 입력하면 업무현황 조회가 가능합니다.</p>
  <input class="gas-url-input" id="gasUrlInput" type="url" placeholder="https://script.google.com/macros/s/.../exec">
  <button class="btn-small" onclick="saveGasUrl()">저장 및 연결</button>
  <div class="drive-status" id="driveStatus">
    <div class="drive-dot" id="driveDot"></div>
    <span id="driveStatusText">연결되지 않음</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

let SCHEDULE = BASE_SCHEDULE;
let GAS_URL = localStorage.getItem('gas_url') || '';

function updateDriveStatus(connected, msg) {
  var dot = document.getElementById('driveDot');
  var txt = document.getElementById('driveStatusText');
  if (!dot || !txt) return;
  dot.className = 'drive-dot' + (connected ? ' connected' : '');
  txt.textContent = msg;
}

function loadFromDrive() {
  if (!GAS_URL) return;
  showToast('🔄 드라이브에서 불러오는 중...', 'info');
  var cb = 'gasCb_' + Date.now();
  var sc = document.createElement('script');
  var tm = setTimeout(function() {
    sc.remove(); delete window[cb];
    updateDriveStatus(false, '연결 실패 — 내장 데이터 사용 중');
    showToast('⚠️ 드라이브 연결 실패', 'warn');
  }, 30000);
  window[cb] = function(data) {
    clearTimeout(tm); sc.remove(); delete window[cb];
    if (data && typeof data === 'object' && Object.keys(data).length > 50) {
      SCHEDULE = data;
      rebuildBranchSelect();
      updateDriveStatus(true, '연결됨 — 최신 데이터');
      showToast('✅ 드라이브 데이터 로드 완료!', 'success');
    } else {
      updateDriveStatus(false, 'URL 오류 — 내장 데이터 사용 중');
      showToast('⚠️ 데이터 없음 — 내장 데이터 사용', 'warn');
    }
  };
  sc.src = GAS_URL + '?action=getData&callback=' + cb;
  document.head.appendChild(sc);
}

function saveGasUrl() {
  var url = document.getElementById('gasUrlInput').value.trim();
  if (!url.startsWith('https://script.google.com')) { showToast('올바른 URL을 입력해주세요', 'warn'); return; }
  GAS_URL = url; localStorage.setItem('gas_url', url);
  showToast('✅ URL 저장 완료! 업무현황 조회가 가능합니다.', 'success');
  updateDriveStatus(true, '연결됨 — 업무현황 조회 가능');
  closeAll();
}

function openGasSetup() {
  var inp = document.getElementById('gasUrlInput');
  if (inp && GAS_URL) inp.value = GAS_URL;
  document.getElementById('gasSetupPanel').style.display = 'block';
  document.getElementById('overlay').style.display = 'block';
}

var BRANCH_KEY_MAP = {central:'Central_Seoul',seoul:'The_Seoul',myeongdong:'The_Myeongdong',square:'Square',deoksugung:'Square',jongno:'The_Jongno'};
function detectBranch(fn) {
  var f = fn.toLowerCase();
  for (var kw in BRANCH_KEY_MAP) { if (f.indexOf(kw) >= 0) return BRANCH_KEY_MAP[kw]; }
  return null;
}
function excelSerialToDate(n) {
  var d = new Date(Math.round((n - 25569) * 86400 * 1000));
  var y = d.getUTCFullYear(), m = d.getUTCMonth()+1, day = d.getUTCDate();
  if (y < 2020 || y > 2030) return null;
  return y + '-' + String(m).padStart(2,'0') + '-' + String(day).padStart(2,'0');
}
var SHEET_CFG = {
  'Central_Seoul':  [{name:'2026',hr:3,ds:4},{name:'2025 ',hr:2,ds:4}],
  'The_Seoul':      [{name:'2026',hr:3,ds:4}],
  'The_Myeongdong': [{name:'2026(통합)',hr:3,ds:4}],
  'Square':         [{name:'2026 (스퀘어,덕수궁)',hr:3,ds:4}],
  'The_Jongno':     [{name:'2026',hr:3,ds:4}]
};
function getBranchPrefix(bk, room, r) {
  if (bk === 'Central_Seoul') return '센트럴';
  if (bk === 'The_Seoul') return '더서울';
  if (bk === 'The_Jongno') return room.startsWith('A') ? '종로2호점' : '종로1호점';
  if (bk === 'The_Myeongdong') return room.startsWith('A') ? '명동1호점' : room.startsWith('M') ? '명동2호점' : room.startsWith('N') ? '명동3호점' : '명동1호점';
  if (bk === 'Square') return (r >= 4 && r <= 10) ? '스퀘어' : '덕수궁';
  return bk;
}
function isThisBranch(bk, branchKey) {
  var map = {Central_Seoul:['센트럴'],The_Seoul:['더서울'],The_Jongno:['종로1호점','종로2호점'],The_Myeongdong:['명동1호점','명동2호점','명동3호점'],Square:['스퀘어','덕수궁']};
  return (map[branchKey] || []).indexOf(bk) >= 0;
}
function parseExcel(wb, branchKey) {
  var cfgs = SHEET_CFG[branchKey] || [];
  var result = {};
  for (var ci = 0; ci < cfgs.length; ci++) {
    var cfg = cfgs[ci];
    var ws = wb.Sheets[cfg.name]; if (!ws) continue;
    var rows = XLSX.utils.sheet_to_json(ws, {header:1,defval:null,raw:true});
    var hRow = rows[cfg.hr] || [];
    var c2d = {};
    for (var c = 2; c < hRow.length; c++) {
      var v = hRow[c]; var ds = null;
      if (typeof v === 'number') ds = excelSerialToDate(v);
      else if (typeof v === 'string' && v.indexOf('-') >= 0) ds = v.slice(0,10);
      if (ds && ds >= '2024-01-01' && ds <= '2027-12-31') c2d[c] = ds;
    }
    for (var r = cfg.ds; r < rows.length; r++) {
      var row = rows[r]; if (!row) continue;
      var rr = row[1]; if (!rr || String(rr).trim() === '' || String(rr) === 'ROOM') continue;
      var room = String(rr).trim();
      var prefix = getBranchPrefix(branchKey, room, r);
      var key = prefix + '||' + room;
      if (!result[key]) result[key] = [];
      for (var col = 2; col < row.length; col++) {
        var dateStr = c2d[col]; if (!dateStr) continue;
        var val = row[col];
        if (val !== null && val !== undefined) {
          var s = String(val).trim().toUpperCase();
          if (s !== 'VAC' && s !== '') { var n = parseFloat(s.replace(',','')); if (!isNaN(n)) result[key].push(dateStr); }

      }
    }
  }
  for (var k in result) result[k] = result[k].filter(function(v,i,a){return a.indexOf(v)===i;}).sort();
  return result;
}

function handleFiles(files) {
  if (!files.length) return;
  var done = 0;
  var newSched = Object.assign({}, SCHEDULE);
  Array.from(files).forEach(function(file) {
    var bk = detectBranch(file.name);
    if (!bk) { showToast('⚠️ 인식 불가: ' + file.name, 'warn'); if (++done === files.length) finalize(newSched); return; }
    var reader = new FileReader();
    reader.onload = function(e) {
      try {
        var wb = XLSX.read(new Uint8Array(e.target.result), {type:'array',raw:true});
        var parsed = parseExcel(wb, bk);
        for (var k in newSched) { if (isThisBranch(k.split('||')[0], bk)) delete newSched[k]; }
        Object.assign(newSched, parsed);
        showToast('✅ ' + file.name + ' 완료 (' + Object.keys(parsed).length + '개 호실)', 'success');
      } catch(err) { showToast('❌ 파싱 오류: ' + file.name, 'error'); }
      if (++done === files.length) finalize(newSched);
    };
    reader.readAsArrayBuffer(file);
  });
}

function finalize(newSched) {
  SCHEDULE = newSched;
  rebuildBranchSelect();
  closeAll();
  if (GAS_URL) syncToDrive(newSched);
}

  } catch(e) { console.warn(e); }
}

function rebuildBranchSelect() {
  var rooms = {};
  Object.keys(SCHEDULE).forEach(function(k) { var p = k.split('||'); if (!rooms[p[0]]) rooms[p[0]] = []; rooms[p[0]].push(p[1]); });
  var sel = document.getElementById('branchSelect');
  var cur = sel.value;
  sel.innerHTML = '<option value="">-- 지점을 선택하세요 --</option>';
  BRANCHES.forEach(function(b) {
    if (rooms[b.key]) { var o = document.createElement('option'); o.value = b.key; o.textContent = b.label; if (b.key === cur) o.selected = true; sel.appendChild(o); }
  });
  if (sel.value) updateRoomSelect();
}

function openUpload() { document.getElementById('updatePanel').style.display = 'block'; document.getElementById('overlay').style.display = 'block'; }
function closeAll() {
  ['updatePanel','gasSetupPanel'].forEach(function(id) { var el = document.getElementById(id); if (el) el.style.display = 'none'; });
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('fileInput').value = '';
}
function showToast(msg, type) {
  var t = document.createElement('div');
  t.className = 'toast toast-' + type; t.textContent = msg;
  document.getElementById('toastContainer').appendChild(t);
  setTimeout(function() { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(function(){t.remove();}, 300); }, 3500);
}

var BRANCHES = [
  {key:'명동1호점',label:'명동 1호점',color:'#4f8ef7'},
  {key:'명동2호점',label:'명동 2호점',color:'#7c5cfa'},
  {key:'명동3호점',label:'명동 3호점',color:'#a78bfa'},
  {key:'더서울',  label:'더서울점',  color:'#34d399'},
  {key:'센트럴',  label:'센트럴점',  color:'#fbbf24'},
  {key:'스퀘어',  label:'스퀘어점',  color:'#f472b6'},
  {key:'덕수궁',  label:'덕수궁점',  color:'#fb923c'},
  {key:'종로1호점',label:'종로 1호점',color:'#38bdf8'},
  {key:'종로2호점',label:'종로 2호점',color:'#4ade80'}
];
var DOW = ['일','월','화','수','목','금','토'];
var MONTHS_KR = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

var branchRooms = {};
Object.keys(SCHEDULE).forEach(function(key) {
  var p = key.split('||'); var branch = p[0], room = p[1];
  if (!branchRooms[branch]) branchRooms[branch] = [];
  branchRooms[branch].push(room);
});
Object.keys(branchRooms).forEach(function(b) { branchRooms[b].sort(); });

var branchSel = document.getElementById('branchSelect');
BRANCHES.forEach(function(b) {
  if (branchRooms[b.key]) { var opt = document.createElement('option'); opt.value = b.key; opt.textContent = b.label; branchSel.appendChild(opt); }
});

function updateRoomSelect() {
  var branch = branchSel.value;
  var roomSel = document.getElementById('roomSelect');
  roomSel.innerHTML = '';
  if (!branch) { roomSel.innerHTML = '<option>-- 지점을 먼저 선택하세요 --</option>'; return; }
  var opt0 = document.createElement('option'); opt0.value = ''; opt0.textContent = '-- 호실을 선택하세요 --'; roomSel.appendChild(opt0);
  branchRooms[branch].forEach(function(r) { var opt = document.createElement('option'); opt.value = r; opt.textContent = r + '호'; roomSel.appendChild(opt); });
}

function switchTab(idx) {
  document.querySelectorAll('.tab').forEach(function(t, i) {
    t.classList.toggle('active', i === idx);
  });
  document.querySelectorAll('.panel').forEach(function(p, i) {
    p.classList.toggle('active', i === idx);
  });
  if (idx === 2) {
    queryWorkStatus();
  }
}

function setToday() {
  var t = new Date(); var y = t.getFullYear(), m = String(t.getMonth()+1).padStart(2,'0'), d = String(t.getDate()).padStart(2,'0');
  document.getElementById('dateInput').value = y + '-' + m + '-' + d;
}


function queryByDate() {
  var dateVal = document.getElementById('dateInput').value;
  if (!dateVal) { alert('날짜를 선택해주세요.'); return; }
  var results = {};
  Object.entries(SCHEDULE).forEach(function(entry) {
    var key = entry[0], dates = entry[1];
    if (dates.indexOf(dateVal) >= 0) { var p = key.split('||'); var branch = p[0], room = p[1]; if (!results[branch]) results[branch] = []; results[branch].push(room); }
  });
  var container = document.getElementById('dateResult');
  var d = new Date(dateVal + 'T12:00:00');
  var dow = DOW[d.getDay()];
  var total = Object.values(results).reduce(function(s,r){return s+r.length;}, 0);
  var label = (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + dow + ')';
  if (total === 0) { container.innerHTML = '<div class="summary-line">📅 <strong>' + label + '</strong></div><div class="result-empty">해당 날짜에 체크아웃하는 객실이 없습니다.</div>'; return; }
  var html = '<div class="summary-line">📅 <strong>' + label + '</strong> — 총 <span>' + total + '개</span> 객실 체크아웃</div>';
  BRANCHES.forEach(function(b) {
    if (!results[b.key] || results[b.key].length === 0) return;
    var rooms = results[b.key].sort();
    html += '<div class="branch-group"><div class="branch-header"><div class="branch-dot" style="background:' + b.color + '"></div>' + b.label + '<div class="count-badge">' + rooms.length + '</div></div><div class="room-chips">' + rooms.map(function(r){return '<div class="chip">'+r+'호</div>';}).join('') + '</div></div>';
  });
  container.innerHTML = html;
}

function queryByRoom() {
  var branch = branchSel.value;
  var room = document.getElementById('roomSelect').value;
  if (!branch || !room) { alert('지점과 호실을 선택해주세요.'); return; }
  var key = branch + '||' + room;
  var dates = SCHEDULE[key] || [];
  var branchInfo = BRANCHES.filter(function(b){return b.key===branch;})[0];
  var today = new Date().toISOString().slice(0,10);
  var future = dates.filter(function(d){return d>=today;}).sort();
  var container = document.getElementById('roomResult');
  if (future.length === 0) { container.innerHTML = '<div class="summary-line">🚪 <strong>' + (branchInfo ? branchInfo.label : branch) + ' ' + room + '호</strong></div><div class="result-empty">향후 예정된 체크아웃 날짜가 없습니다.</div>'; return; }
  var html = '<div class="summary-line">🚪 <strong>' + (branchInfo ? branchInfo.label : branch) + ' ' + room + '호</strong> — 향후 <span>' + future.length + '일</span> 체크아웃 예정</div>';
  html += '<div class="card" style="padding:0;overflow:hidden;"><div class="date-list">';
  var lastMonth = '';
  future.forEach(function(ds) {
    var d = new Date(ds + 'T12:00:00'); var month = MONTHS_KR[d.getMonth()]; var di = d.getDay(); var dc = di===0?'sun':di===6?'sat':'';
    if (month !== lastMonth) { html += '<div class="month-divider">— ' + month + ' —</div>'; lastMonth = month; }
    html += '<div class="date-item"><div class="dot-green"></div><div class="date-day">' + (d.getMonth()+1) + '월 ' + d.getDate() + '일</div><div class="date-dow ' + dc + '">' + DOW[di] + '요일</div></div>';
  });
  html += '</div></div>';
  container.innerHTML = html;
}

function queryWorkStatus() {
  if (!GAS_URL) {
    document.getElementById('workResult').innerHTML =
      '<p style="color:#888;text-align:center;">⚠️ 구글 드라이브 연동이 필요합니다.<br>GAS_URL을 설정해주세요.</p>';
    return;
  }

  var today = new Date().toISOString().slice(0, 10);

  // 날짜 레이블 표시
  var d = new Date();
  var days = ['일','월','화','수','목','금','토'];
  var label = (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + days[d.getDay()] + ') 업무현황';
  document.getElementById('workDateLabel').textContent = label;
  document.getElementById('workResult').innerHTML =
    '<p style="color:#888;text-align:center;">조회 중...</p>';

  var url = GAS_URL + '?action=getWorkStatus&date=' + today;

  fetch(url, { redirect: 'follow' })
    .then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.text();
    })
    .then(function(text) {
      var data;
      try { data = JSON.parse(text); }
      catch(e) { throw new Error('응답 파싱 실패: ' + text.slice(0, 100)); }
      if (data.error) {
        document.getElementById('workResult').innerHTML =
          '<div class="result-empty">❌ ' + data.error + '</div>';
        return;
      }
      renderWorkStatus(data);
    })
    .catch(function(err) {
      // fetch 실패 시 JSONP 폴백
      var cbName = 'cb_workstatus_' + Date.now();
      var sc = document.createElement('script');
      var tm = setTimeout(function() {
        if (sc.parentNode) sc.parentNode.removeChild(sc);
        delete window[cbName];
        document.getElementById('workResult').innerHTML =
          '<div class="result-empty">❌ 데이터 로드 실패. GAS URL을 확인하세요.</div>';
      }, 15000);
      window[cbName] = function(data) {
        clearTimeout(tm);
        if (sc.parentNode) sc.parentNode.removeChild(sc);
        delete window[cbName];
        if (data.error) {
          document.getElementById('workResult').innerHTML =
            '<div class="result-empty">❌ ' + data.error + '</div>';
          return;
        }
        renderWorkStatus(data);
      };
      sc.onerror = function() {
        clearTimeout(tm);
        if (sc.parentNode) sc.parentNode.removeChild(sc);
        delete window[cbName];
        document.getElementById('workResult').innerHTML =
          '<div class="result-empty">❌ 데이터 로드 실패. GAS URL을 확인하세요.</div>';
      };
      sc.src = url + '&callback=' + cbName;
      document.head.appendChild(sc);
    });
}

function renderWorkStatus(data) {
  var container = document.getElementById('workResult');
  if (data.error) {
    container.innerHTML = '<div class="result-empty">❌ ' + data.error + '</div>';
    return;
  }

  var html = '';

  // ── 🔍 디버그: GAS 응답 raw 데이터 확인 (키 목록) ──
  var keys = Object.keys(data);
  html += '<div class="memo-box" style="margin-bottom:10px;">';
  html += '<div class="memo-box-title">🔍 GAS 응답 키 확인 (디버그)</div>';
  html += '<div style="font-size:0.85rem;">받은 키: <strong>' + (keys.length ? keys.join(', ') : '없음') + '</strong></div>';
  keys.forEach(function(k) {
    var v = data[k];
    var len = Array.isArray(v) ? v.length + '개' : (v === null ? 'null' : typeof v);
    html += '<div style="font-size:0.82rem;color:var(--text2);">• ' + k + ': ' + len + '</div>';
  });
  html += '</div>';

  // ── 당일 메모 ──
  if (data.memos && data.memos.length > 0) {
    html += '<div class="memo-box"><div class="memo-box-title">📋 당일 작업 메모</div>';
    html += data.memos.map(function(m){ return '• ' + m; }).join('<br>');
    html += '</div>';
  }

  // ── 당일 작업 예정 (scheduled) ──
  if (data.scheduled && data.scheduled.length > 0) {
    html += '<div class="work-section">';
    html += '<div class="work-section-title blue">📅 오늘 작업 예정 (' + data.scheduled.length + '개 객실)</div>';
    html += '<div class="work-list">';
    data.scheduled.forEach(function(item) {
      html += '<div class="work-item"><div class="work-item-header">';
      html += '<span class="work-room">' + item.room + '호</span>';
      html += '<span class="work-branch">' + item.branch + '</span>';
      html += '<span class="work-assignee">' + item.assignee + '</span>';
      html += '</div></div>';
    });
    html += '</div></div>';
  }

  // ── 작업 완료 ──
  if (data.completed && data.completed.length > 0) {
    html += '<div class="work-section">';
    html += '<div class="work-section-title blue">🔵 작업 완료 (' + data.completed.length + '개 객실)</div>';
    html += '<div class="work-list">';
    data.completed.forEach(function(item) {
      html += '<div class="work-item"><div class="work-item-header">';
      html += '<span class="work-room">' + item.room + '호</span>';
      html += '<span class="work-branch">' + item.branch + '</span>';
      html += '<span class="work-assignee">' + item.assignee + '</span>';
      html += '</div></div>';
    });
    html += '</div></div>';
  }

  // ── 작업 미완료 ──
  if (data.incomplete && data.incomplete.length > 0) {
    html += '<div class="work-section">';
    html += '<div class="work-section-title red">🔴 작업 미완료 (' + data.incomplete.length + '개 객실)</div>';
    html += '<div class="work-list">';
    data.incomplete.forEach(function(item) {
      html += '<div class="work-item"><div class="work-item-header">';
      html += '<span class="work-room">' + item.room + '호</span>';
      html += '<span class="work-branch">' + item.branch + '</span>';
      html += '<span class="work-assignee">' + item.assignee + '</span>';
      html += '</div></div>';
    });
    html += '</div></div>';
  }

  // ── 부분 완료 ──
  if (data.partial && data.partial.length > 0) {
    html += '<div class="work-section">';
    html += '<div class="work-section-title yellow">🟡 부분 완료 (' + data.partial.length + '개 객실)</div>';
    html += '<div class="work-list">';
    data.partial.forEach(function(item) {
      html += '<div class="work-item"><div class="work-item-header">';
      html += '<span class="work-room">' + item.room + '호</span>';
      html += '<span class="work-branch">' + item.branch + '</span>';
      html += '<span class="work-assignee">' + item.assignee + '</span>';
      html += '</div>';
      if (!item.tasks) {
        html += '<div class="work-task task-unknown">⚠️ 직접 확인 필요</div>';
      } else {
        item.tasks.forEach(function(t) {
          html += '<div class="work-task ' + (t.done===true?'task-done':t.done===false?'task-fail':'task-unknown') + '">';
          html += (t.done===true?'✅':t.done===false?'❌':'⚠️') + ' ' + t.name;
          if (t.done===null) html += ' — 직접 확인 필요';
          html += '</div>';
        });
      }
      html += '</div>';
    });
    html += '</div></div>';
  }

  // ── 데이터 없음 ──
  var hasAny = (data.scheduled && data.scheduled.length) ||
               (data.completed  && data.completed.length)  ||
               (data.incomplete && data.incomplete.length) ||
               (data.partial    && data.partial.length);
  if (!hasAny) {
    html += '<div class="result-empty">해당 날짜에 작업 데이터가 없습니다.</div>';
  }

  container.innerHTML = html;
}
